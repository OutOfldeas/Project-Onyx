name: Core-Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Spiellogik (Onyx.Core) testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tests ausführen
        run: dotnet test tools/CoreTests/Onyx.Core.Tests.csproj --logger "console;verbosity=normal"
